<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Senior Backend Engineer Portfolio">
    <meta name="theme-color" content="#0a0e14">
    <title>Gerardo Chay — Senior Backend Engineer</title>
    <link rel="stylesheet" href="css/colors.css?v=5">
    <link rel="stylesheet" href="css/style.css?v=5">
    <link rel="stylesheet" href="css/layout.css?v=5">
    <link rel="stylesheet" href="css/components.css?v=5">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="page-background" aria-hidden="true"><div class="background-grid"></div><div class="background-glow"></div></div>

    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="#top" aria-label="Gerardo Chay — Back to top">Gerardo Chay</a>
            <nav class="desktop-nav" aria-label="Primary navigation">
                <div class="desktop-nav-links"></div>
            </nav>
            <div class="header-actions">
                <div class="language-switcher" aria-label="Language selector — coming in Phase 5">
                    <button type="button" class="language-option active" aria-pressed="true" disabled>EN</button>
                    <span aria-hidden="true">|</span>
                    <button type="button" class="language-option" aria-pressed="false" disabled>ES</button>
                </div>
                <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <main id="main-content">
        <section class="hero" id="top" aria-labelledby="hero-name">
            <div class="section-container hero-layout">
                <div class="hero-copy">
                    <p class="eyebrow">Backend · Cloud · Architecture</p>
                    <h1 id="hero-name" class="hero-name"></h1>
                    <p class="hero-role"></p>
                    <p class="hero-specialization"></p>
                    <p class="hero-description"></p>
                    <p class="availability"><span class="availability-dot" aria-hidden="true"></span><span></span></p>
                    <div class="hero-actions"></div>
                    <div class="hero-socials" aria-label="Professional profiles"></div>
                </div>
                <div class="hero-photo-wrap">
                    <div class="hero-photo-frame">
                        <img class="hero-photo" src="assets/images/profile-placeholder.svg" width="520" height="620" alt="Professional photo placeholder for Gerardo Chay">
                    </div>
                    <p class="photo-note">Professional photo placeholder</p>
                </div>
            </div>
        </section>

        <section class="content-section" id="about" aria-labelledby="about-title">
            <div class="section-container">
                <div class="section-heading"><span class="section-number">01</span><div><p class="section-kicker">Profile</p><h2 id="about-title">About</h2></div></div>
                <div class="about-layout">
                    <p class="about-summary"></p>
                    <div class="highlight-grid"></div>
                </div>
            </div>
        </section>

        <section class="content-section section-tinted" id="experience" aria-labelledby="experience-title">
            <div class="section-container">
                <div class="section-heading"><span class="section-number">02</span><div><p class="section-kicker">Production experience</p><h2 id="experience-title">Experience</h2></div></div>
                <p class="section-intro experience-intro"></p>
                <div class="experience-list"></div>
            </div>
        </section>

        <section class="content-section" id="work" aria-labelledby="work-title">
            <div class="section-container">
                <div class="section-heading"><span class="section-number">03</span><div><p class="section-kicker">Professional case studies</p><h2 id="work-title">Selected Work</h2></div></div>
                <p class="section-intro work-intro"></p>
                <p class="work-confidentiality"></p>
                <div class="case-study-grid"></div>
            </div>
        </section>

        <section class="content-section section-tinted" id="expertise" aria-labelledby="expertise-title">
            <div class="section-container">
                <div class="section-heading"><span class="section-number">04</span><div><p class="section-kicker">Engineering domains</p><h2 id="expertise-title">Expertise</h2></div></div>
                <p class="section-intro expertise-intro"></p>
                <div class="expertise-grid"></div>
            </div>
        </section>

        <section class="content-section" id="education" aria-labelledby="education-title">
            <div class="section-container">
                <div class="section-heading"><span class="section-number">05</span><div><p class="section-kicker">Academic background</p><h2 id="education-title">Education</h2></div></div>
                <div class="education-list"></div>
            </div>
        </section>

        <section class="content-section contact-section" id="contact" aria-labelledby="contact-title">
            <div class="section-container contact-layout">
                <div><p class="section-kicker">Contact</p><h2 id="contact-title" class="contact-title"></h2><p class="contact-copy"></p></div>
                <div class="contact-actions"></div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="section-container footer-inner">
            <p>© <span id="current-year"></span> <span class="footer-name"></span></p>
            <p class="footer-role"></p>
            <div class="footer-links" aria-label="Professional profiles"></div>
        </div>
    </footer>

    <div class="mobile-menu-overlay" id="mobile-menu" aria-hidden="true">
        <div class="mobile-menu-panel" role="dialog" aria-modal="true" aria-label="Mobile navigation">
            <div class="mobile-menu-head"><span class="mobile-menu-title">Navigate</span><button class="close-menu-btn" type="button" aria-label="Close menu">×</button></div>
            <nav class="mobile-nav-links" aria-label="Mobile navigation"></nav>
            <div class="mobile-language-slot"></div>
        </div>
    </div>

    <noscript><p class="noscript-message">JavaScript is required to load the portfolio content.</p></noscript>
    <script src="js/main.js?v=5" defer></script>
    <script src="js/data-loader.js?v=5" defer></script>
</body>
</html>
