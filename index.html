<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Senior Backend Engineer Portfolio">
    <meta name="theme-color" content="#0a0e14">
    <title>Backend Portfolio</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Backend Portfolio">
    <meta property="og:description" content="Senior Backend Engineer Portfolio">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Backend Portfolio">
    <meta name="twitter:description" content="Senior Backend Engineer Portfolio">
    <link rel="stylesheet" href="css/colors.css?v=3">
    <link rel="stylesheet" href="css/style.css?v=3">
    <link rel="stylesheet" href="css/layout.css?v=3">
    <link rel="stylesheet" href="css/components.css?v=3">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
</head>
<body>
    <div class="bg" aria-hidden="true"><div class="bg-grid"></div><div class="bg-glow"></div></div>
    <div class="app">
        <aside class="sidebar">
            <div class="console">
                <div class="console-bar"><span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span><span class="console-path">portfolio: ~</span></div>
                <div class="console-body">
                    <div class="profile">
                        <div class="avatar-placeholder" aria-hidden="true"><i class="fas fa-user"></i></div>
                        <div class="profile-id"><h1 class="name"></h1><p class="title"></p></div>
                    </div>
                </div>
            </div>
        </aside>
        <main class="main-content">
            <nav class="navbar" aria-label="Portfolio sections">
                <div class="mobile-header">
                    <div class="mobile-profile">
                        <div class="avatar-placeholder" aria-hidden="true"><i class="fas fa-user"></i></div>
                        <div><h1 class="name"></h1><p class="title"></p></div>
                    </div>
                    <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false"><i class="fas fa-bars" aria-hidden="true"></i></button>
                </div>
                <div class="tabbar"><span class="tabbar-prompt" aria-hidden="true">&gt;</span><div class="tab-navigation"></div></div>
            </nav>
            <div class="tab-content">
                <section id="about" class="section tab-pane active">
                    <div class="hero">
                        <div class="hero-term" aria-hidden="true"><span class="term-prompt">portfolio:~$</span><span class="term-cmd">whoami</span></div>
                        <h2 class="hero-headline">Backend Portfolio</h2>
                        <p class="hero-sub">Senior Backend Engineer</p>
                    </div>
                    <div class="section-head"><span class="section-index">01</span><h3 class="section-title"></h3><span class="section-rule"></span></div>
                    <p class="about-text"></p>
                </section>
                <section id="resume" class="section tab-pane">
                    <div class="section-head"><span class="section-index">02</span><h3 class="section-title"></h3><span class="section-rule"></span></div>
                    <div class="resume-content">
                        <div class="resume-section"><span class="console-key">// work experience</span><div class="timeline"></div></div>
                        <div class="resume-section"><span class="console-key">// education</span><div class="timeline"></div></div>
                    </div>
                </section>
                <section id="portfolio" class="section tab-pane">
                    <div class="section-head"><span class="section-index">03</span><h3 class="section-title"></h3><span class="section-rule"></span></div>
                    <div class="portfolio-grid"></div>
                </section>
            </div>
            <footer class="footer"></footer>
        </main>
    </div>
    <div class="mobile-menu-overlay" id="mobile-menu" aria-hidden="true">
        <div class="mobile-menu-content" role="dialog" aria-modal="true" aria-label="Portfolio navigation">
            <button class="close-menu-btn" type="button" aria-label="Close menu">&times;</button>
            <div class="drawer-scroll"><nav class="mobile-nav-links" aria-label="Portfolio sections"></nav></div>
        </div>
    </div>
    <script src="js/main.js?v=3" defer></script>
    <script src="js/portfolio.js?v=3" defer></script>
    <script src="js/data-loader.js?v=3" defer></script>
</body>
</html>
