<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Single Sign-On">
  <defs>
    <radialGradient id="glow" cx="22%" cy="0%" r="85%">
      <stop offset="0" stop-color="#5be6c4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#5be6c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0e14"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- connections: one identity -> many apps -->
  <g stroke="#2b3645" stroke-width="2.5" stroke-dasharray="6 8" fill="none">
    <path d="M 300 250 C 380 250, 420 150, 510 150"/>
    <path d="M 300 250 H 510"/>
    <path d="M 300 250 C 380 250, 420 350, 510 350"/>
  </g>

  <!-- the key (single identity) -->
  <g transform="translate(190 250)" stroke="#5be6c4" stroke-width="9" fill="none" stroke-linecap="round">
    <circle cx="-44" cy="0" r="34"/>
    <circle cx="-44" cy="0" r="12" fill="#0a0e14" stroke-width="6"/>
    <line x1="-10" y1="0" x2="96" y2="0"/>
    <line x1="62" y1="0" x2="62" y2="26"/>
    <line x1="88" y1="0" x2="88" y2="20"/>
  </g>

  <!-- app tiles, each authenticated (check) -->
  <g>
    <g transform="translate(512 118)">
      <rect width="76" height="64" rx="12" fill="#11161f" stroke="#2b3645" stroke-width="3"/>
      <path d="M 22 32 l 12 13 l 22 -26" fill="none" stroke="#5be6c4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(512 218)">
      <rect width="76" height="64" rx="12" fill="#11161f" stroke="#5be6c4" stroke-width="3"/>
      <path d="M 22 32 l 12 13 l 22 -26" fill="none" stroke="#5be6c4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(512 318)">
      <rect width="76" height="64" rx="12" fill="#11161f" stroke="#2b3645" stroke-width="3"/>
      <path d="M 22 32 l 12 13 l 22 -26" fill="none" stroke="#5be6c4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="400" y="452" text-anchor="middle" fill="#5c6677" font-family="ui-monospace,Menlo,monospace" font-size="22" letter-spacing="4">// single sign-on · identity</text>
</svg>
