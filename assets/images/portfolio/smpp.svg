<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Two-way SMS gateway (SMPP)">
  <defs>
    <radialGradient id="glow" cx="22%" cy="0%" r="85%">
      <stop offset="0" stop-color="#5be6c4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#5be6c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0e14"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- customer phone -->
  <g transform="translate(190 250)">
    <rect x="-50" y="-86" width="100" height="172" rx="18" fill="#11161f" stroke="#5be6c4" stroke-width="4"/>
    <rect x="-36" y="-66" width="72" height="120" rx="4" fill="#0a0e14"/>
    <circle cx="0" cy="68" r="6" fill="#2b3645"/>
  </g>

  <!-- gateway / SMSC node -->
  <g transform="translate(610 250)">
    <line x1="0" y1="-92" x2="0" y2="-70" stroke="#5be6c4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-96" r="6" fill="#5be6c4"/>
    <rect x="-60" y="-70" width="120" height="140" rx="14" fill="#11161f" stroke="#5be6c4" stroke-width="4"/>
    <g stroke="#2b3645" stroke-width="3">
      <line x1="-40" y1="-38" x2="40" y2="-38"/><line x1="-40" y1="0" x2="40" y2="0"/><line x1="-40" y1="38" x2="40" y2="38"/>
    </g>
    <g fill="#5be6c4"><circle cx="-40" cy="-38" r="4"/><circle cx="-40" cy="0" r="4"/><circle cx="-40" cy="38" r="4"/></g>
  </g>

  <!-- inbound: customer -> gateway -->
  <line x1="248" y1="206" x2="540" y2="206" stroke="#2b3645" stroke-width="2.5" stroke-dasharray="6 8"/>
  <path d="M 540 200 l 14 6 l -14 6 Z" fill="#5be6c4"/>
  <g transform="translate(400 178)">
    <path d="M -46 -22 H 46 a 12 12 0 0 1 12 12 V 10 a 12 12 0 0 1 -12 12 H -10 l -16 16 V 22 H -46 a 12 12 0 0 1 -12 -12 V -10 a 12 12 0 0 1 12 -12 Z"
          fill="#0a0e14" stroke="#5be6c4" stroke-width="3.5"/>
    <path d="M -34 -10 l 34 18 l 34 -18" fill="none" stroke="#5be6c4" stroke-width="3"/>
  </g>

  <!-- reply: gateway -> customer -->
  <line x1="552" y1="300" x2="260" y2="300" stroke="#2b3645" stroke-width="2.5" stroke-dasharray="6 8"/>
  <path d="M 260 294 l -14 6 l 14 6 Z" fill="#f2a65a"/>
  <g transform="translate(400 326)">
    <path d="M -46 -22 H 46 a 12 12 0 0 1 12 12 V 10 a 12 12 0 0 1 -12 12 H 10 l 16 16 V 22 H 46 a 12 12 0 0 1 12 -12 V -10 Z"
          fill="#0a0e14" stroke="#f2a65a" stroke-width="3.5" transform="scale(-1,1)"/>
    <g fill="#f2a65a"><circle cx="-22" cy="0" r="4"/><circle cx="0" cy="0" r="4"/><circle cx="22" cy="0" r="4"/></g>
  </g>

  <text x="400" y="456" text-anchor="middle" fill="#5c6677" font-family="ui-monospace,Menlo,monospace" font-size="22" letter-spacing="4">// two-way sms · smpp</text>
</svg>
