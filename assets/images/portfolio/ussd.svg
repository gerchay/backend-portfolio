<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="USSD self-service menus">
  <defs>
    <radialGradient id="glow" cx="22%" cy="0%" r="85%">
      <stop offset="0" stop-color="#5be6c4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#5be6c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0e14"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g transform="translate(400 244)">
    <!-- phone -->
    <rect x="-104" y="-160" width="208" height="320" rx="28" fill="#11161f" stroke="#2b3645" stroke-width="4"/>
    <rect x="-86" y="-132" width="172" height="264" rx="8" fill="#0a0e14"/>
    <rect x="-18" y="-150" width="36" height="6" rx="3" fill="#2b3645"/>
    <!-- USSD dialog -->
    <g transform="translate(0 -8)">
      <rect x="-78" y="-104" width="156" height="208" rx="10" fill="#11161f" stroke="#5be6c4" stroke-width="3"/>
      <text x="-62" y="-78" fill="#5be6c4" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="700">*771#</text>
      <line x1="-62" y1="-64" x2="62" y2="-64" stroke="#2b3645" stroke-width="2"/>
      <g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#97a1b0">
        <text x="-62" y="-36">1</text><line x1="-46" y1="-40" x2="56" y2="-40" stroke="#2b3645" stroke-width="6" stroke-linecap="round"/>
        <text x="-62" y="-8">2</text><line x1="-46" y1="-12" x2="40" y2="-12" stroke="#2b3645" stroke-width="6" stroke-linecap="round"/>
        <text x="-62" y="20">3</text><line x1="-46" y1="16" x2="52" y2="16" stroke="#2b3645" stroke-width="6" stroke-linecap="round"/>
      </g>
      <rect x="-62" y="36" width="124" height="26" rx="6" fill="#0a0e14" stroke="#2b3645" stroke-width="2"/>
      <rect x="-58" y="46" width="8" height="6" fill="#5be6c4"/>
      <rect x="-4" y="72" width="66" height="24" rx="6" fill="#5be6c4"/>
      <text x="29" y="89" text-anchor="middle" fill="#0a0e14" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700">SEND</text>
      <text x="-44" y="89" text-anchor="middle" fill="#5c6677" font-family="ui-monospace,Menlo,monospace" font-size="13">back</text>
    </g>
  </g>
  <text x="400" y="452" text-anchor="middle" fill="#5c6677" font-family="ui-monospace,Menlo,monospace" font-size="22" letter-spacing="4">// ussd self-service · session menus</text>
</svg>
