<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Enterprise Workflow Tool — support">
  <defs>
    <radialGradient id="glow" cx="22%" cy="0%" r="85%">
      <stop offset="0" stop-color="#5be6c4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#5be6c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0e14"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- relaxed agent: head leaning, shoulders -->
  <g transform="translate(360 250)">
    <path d="M -120 150 a 120 90 0 0 1 240 0" fill="#11161f" stroke="#2b3645" stroke-width="4"/>
    <circle cx="0" cy="-2" r="66" fill="#11161f" stroke="#2b3645" stroke-width="4"/>
    <!-- calm closed-eye smile face -->
    <g fill="none" stroke="#97a1b0" stroke-width="5" stroke-linecap="round">
      <path d="M -34 -14 a 12 8 0 0 1 24 0"/>
      <path d="M 10 -14 a 12 8 0 0 1 24 0"/>
      <path d="M -22 24 a 26 18 0 0 0 44 0"/>
    </g>
    <!-- headset -->
    <path d="M -84 4 a 84 84 0 0 1 168 0" fill="none" stroke="#5be6c4" stroke-width="9" stroke-linecap="round"/>
    <rect x="-100" y="0" width="30" height="56" rx="12" fill="#5be6c4"/>
    <rect x="70" y="0" width="30" height="56" rx="12" fill="#5be6c4"/>
    <path d="M 84 40 q 14 40 -38 52" fill="none" stroke="#5be6c4" stroke-width="7" stroke-linecap="round"/>
    <circle cx="46" cy="92" r="9" fill="#5be6c4"/>
  </g>

  <!-- happy support bubble with check -->
  <g transform="translate(575 150)">
    <path d="M -56 -40 H 56 a 16 16 0 0 1 16 16 V 24 a 16 16 0 0 1 -16 16 H -18 l -20 22 v -22 H -56 a 16 16 0 0 1 -16 -16 V -24 a 16 16 0 0 1 16 -16 Z"
          fill="#0a0e14" stroke="#5be6c4" stroke-width="4"/>
    <path d="M -28 -2 l 14 16 l 34 -34" fill="none" stroke="#5be6c4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="456" text-anchor="middle" fill="#5c6677" font-family="ui-monospace,Menlo,monospace" font-size="22" letter-spacing="4">// support workflow · smoother queues</text>
</svg>
